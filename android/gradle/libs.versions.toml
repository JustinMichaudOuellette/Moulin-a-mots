[versions]
accompanist = "0.36.0"
annotation = "1.10.0"
androidGradlePlugin = "9.3.2"
androidxActivity = "1.13.0"
androidxAppcompat = "1.8.0"
androidxComposeBom = "2026.08.00"
androidxEspresso = "3.7.0"
androidxLifecycle = "2.11.0"
androidxNavigation = "2.10.0"
kotlin = "2.4.10"
kotlinxCoroutines = "1.11.0"
material = "1.14.0"
ksp = "2.3.11"
room = "2.8.4"
